name: Doratou Backend CI

on:
  push:
    branches:
      - main
      - feature/ci
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: doratou/backend

jobs:
  quality-gates:
    name: Run backend quality gates
    uses: ./.github/workflows/CI-QualityGate.yml
    secrets: inherit
    permissions:
      contents: read

  build:
    name: Build and publish backend image
    runs-on: ubuntu-latest
    # needs: quality-gates

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME,,}"
          branch="$(echo "$branch" | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            branch_tag="latest"
          elif [ "$GITHUB_REF_NAME" = "develop" ]; then
            branch_tag="develop"
          else
            branch_tag="$branch"
          fi

          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${branch_tag}"
            echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}

  build-migration:
    name: Build and publish migration image
    runs-on: ubuntu-latest
    # needs: quality-gates

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.migrate
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/doratou/migration:latest
            ${{ env.REGISTRY }}/doratou/migration:${{ github.sha }}


  build-docs:
    name: Build and publish API documentation image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.docs
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/doratou/api-docs:latest
            ghcr.io/doratou/api-docs:${{ github.sha }}

  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest

    needs:
      - build
      - build-migration
      - build-docs

    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4
        with:
          repository: Doratou/Devops
          ref: main
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Backend and Migration and Docs Image Tags
        working-directory: devops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          yq -i '
            .backend.image.tag = strenv(IMAGE_TAG) |
            .migration.image.tag = strenv(IMAGE_TAG) |
            .docs.image.tag = strenv(IMAGE_TAG)
          ' helm/app/values.yaml

      - name: Commit and Push GitOps Changes
        working-directory: devops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/app/values.yaml

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore(gitops): update backend and migration to ${IMAGE_TAG:0:7}"

          git push origin main
